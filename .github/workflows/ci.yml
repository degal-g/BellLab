name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Treat warnings as errors
        run: pytest -W error
      - name: Compile modules
        run: python -m compileall -q belllab tests examples
      - name: Build package
        run: |
          python -m pip install build
          rm -rf dist build
          python -m build
      - name: Check package metadata
        run: python scripts/check_package_metadata.py dist/*.whl
      - name: Smoke-test installed wheel CLI
        run: |
          rm -rf /tmp/belllab-wheel-smoke
          python -m venv /tmp/belllab-wheel-smoke
          /tmp/belllab-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/belllab-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/belllab-wheel-smoke/bin/python -m belllab --version
          /tmp/belllab-wheel-smoke/bin/belllab --help
          /tmp/belllab-wheel-smoke/bin/belllab version
